<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Личная страница</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    background:repeating-conic-gradient(from 0deg at 50% 40%,#6a2fd6 0 10deg,#5a22c4 10deg 20deg)}
  .card{background:#fff;color:#2a1a5e;border:4px solid #2a1a5e;border-radius:24px;
    box-shadow:0 8px 0 #2a1a5e;padding:32px 28px;max-width:520px;width:100%;text-align:center}
  h1{font-size:34px;font-weight:900;letter-spacing:1px;margin-bottom:10px}
  h1 span:nth-child(4n+1){color:#e53935} h1 span:nth-child(4n+2){color:#1e88e5}
  h1 span:nth-child(4n+3){color:#43a047} h1 span:nth-child(4n){color:#fbc02d}
  p{font-size:17px;line-height:1.45;opacity:.85}
  .tag{display:inline-block;margin-top:18px;padding:6px 14px;border-radius:999px;
    background:#fff3c4;border:2px solid #2a1a5e;font-weight:800;font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <h1><span>С</span><span>К</span><span>О</span><span>Р</span><span>О</span></h1>
    <p>Здесь будет что-то новое.<br>Страница пока в работе.</p>
    <div class="tag">🔒 скрытая страница</div>
  </div>
</body>
</html>
